<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Desk Buddy</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <main id="stage">
    <canvas id="three"></canvas>
    <div id="hud">
      <div class="big"><span id="score">–</span><small>分</small></div>
      <div>頭前傾 <b id="neck">–</b>｜靠近螢幕 <b id="lean">–</b>｜肩歪 <b id="tilt">–</b>°</div>
      <div>駝背累計 <b id="badtime">0</b> 秒</div>
      <div id="cue"></div>
    </div>
  </main>
  <aside id="panel">
    <h1>Desk Buddy</h1>
    <button id="start">開始（開啟鏡頭）</button>
    <button id="calibrate">坐正，按這裡校準</button>
    <button id="stretch">一起做肩頸伸展</button>
    <label>誇張倍率 <b id="gainval">2.0×</b>
      <input id="gain" type="range" min="1" max="3" step="0.5" value="2" />
    </label>
    <label><input type="checkbox" id="voice" checked /> 語音提醒</label>
    <label>提醒前的寬限
      <select id="grace">
        <option value="3">3 秒（demo 用）</option>
        <option value="10" selected>10 秒</option>
        <option value="60">1 分鐘</option>
      </select>
    </label>
    <label class="file">換成自己的 VRM
      <input id="vrmfile" type="file" accept=".vrm" />
    </label>
    <div id="camwrap">
      <video id="cam" playsinline muted></video>
      <canvas id="overlay"></canvas>
    </div>
    <p id="status">坐在筆電前，讓頭和雙肩入鏡。</p>
  </aside>
  <script type="module" src="/src/posture.js"></script>
</body>
</html>
